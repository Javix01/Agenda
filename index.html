<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#12233f;--mut:#667085;--line:#dde1e8;--acc:#12233f;--onacc:#fff;--gold:#b7791f;--ok:#2f855a;--warn:#c05621;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a0b8;--line:#2a3855;--acc:#e8edf6;--onacc:#0e1626;--gold:#e5b04a;--ok:#68d391;--warn:#f6ad55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a0b8;--line:#2a3855;--acc:#e8edf6;--onacc:#0e1626;--gold:#e5b04a;--ok:#68d391;--warn:#f6ad55;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-size:3rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:.9rem}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{background:var(--acc);color:var(--onacc);border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:.88rem}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;margin:4px 0;font-size:16px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item span.t{flex:1}
.st{min-width:104px;text-align:center}
.s0{background:transparent;color:var(--mut);border:1px solid var(--line)}.s1{background:var(--warn);color:#fff}.s2{background:var(--ok);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:14px 2px;font-size:.74rem}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.week{display:flex;gap:6px;align-items:flex-end;height:80px}
.week div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}.week i{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
svg{width:100%;height:auto;display:block}
.due{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line)}.chips button.on{background:var(--acc);color:var(--onacc)}
.pre{white-space:pre-wrap;word-break:break-word}
.item.ok{background:rgba(47,133,90,.22);border-radius:10px;padding:9px 10px;border-bottom:0;margin:3px 0}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.tag.sim{background:var(--gold);border-color:var(--gold);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stats div{background:var(--bg);border-radius:9px;padding:8px}.stats b{display:block;font-size:1.1rem}

.cloudbar{margin-bottom:12px}.cloudbar .mut{font-size:.82rem}.cloudstatus{display:flex;align-items:center;gap:7px;font-size:.86rem}.cloud-dot{width:9px;height:9px;border-radius:50%;background:#c05621;display:inline-block}.cloud-dot.ok{background:#2f855a}.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.authgrid button{width:100%}.smallnote{font-size:.8rem;color:var(--mut);margin-top:8px}
</style>
</head>

<main id="app"></main>

<script>
const KEY='agendaCNP.v1',DIRTY='agendaCNP.cloudDirty.v1',IV=[1,3,7,15,30],TABS=['Hoy','Temario','Simulacros','Físicas','Entrenos','Ajustes'];
let S={fecha:'',bloques:[{id:'b1',n:'Ciencias jurídicas'},{id:'b2',n:'Ciencias sociales'},{id:'b3',n:'Técnico-científicas'}],temas:[],sims:[],horas:{},fis:[],pruebas:[{id:'p1',n:'Circuito de agilidad',t:'time',obj:null},{id:'p2',n:'Carrera 1000 m',t:'time',obj:null},{id:'p3',n:'Dominadas',t:'rep',obj:null}],entr:[]};
let tab=0,fp=null,cloudClient=null,cloudUser=null,cloudBusy=false,syncAfterBusy=false,syncTimer=null,syncState='offline',syncMessage='Sin configurar';
const SUPABASE_URL='https://jtgdzxnzwfmdbdqhuebv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_chB5Jtt_3vEsZOh4zgGPag_YRhQVc1g';
const cloudConfigured=()=>window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('TU-PROYECTO')&&SUPABASE_ANON_KEY.length>30&&!SUPABASE_ANON_KEY.includes('PEGA_AQUI');
if(cloudConfigured())cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.entr)S.entr=[];
if(!S.sexo)S.sexo='H';
if(!S.escala)S.escala='ba';
S.pruebas.forEach(p=>{const m={p1:'ag',p2:'ca',p3:'fu'};if(m[p.id]&&!p.bk)p.bk=m[p.id]});
{const used=id=>S.fis.some(r=>r.p===id);S.pruebas.forEach(p=>{if(p.id==='p3'&&p.n==='Flexiones'&&!used('p3'))p.n='Dominadas'});S.pruebas=S.pruebas.filter(p=>!(p.id==='p4'&&p.n==='Natación 50 m'&&!used('p4')))}
let eo=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(DIRTY,'1')}catch(e){syncMessage='No se pudo guardar en este dispositivo'};scheduleSync()};
function scheduleSync(){if(!cloudClient||!cloudUser||!navigator.onLine)return;if(cloudBusy){syncAfterBusy=true;return}clearTimeout(syncTimer);syncState='pending';syncMessage='Cambios pendientes de sincronizar';syncTimer=setTimeout(syncCloud,1200)}
async function syncCloud(){if(!cloudClient||!cloudUser||!navigator.onLine||cloudBusy)return;cloudBusy=true;syncState='syncing';syncMessage='Sincronizando…';renderCloudStatus();try{const {error}=await cloudClient.from('agenda_data').upsert({user_id:cloudUser.id,payload:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;localStorage.removeItem(DIRTY);syncState='ok';syncMessage='Todo sincronizado'}catch(e){syncState='error';syncMessage='No se pudo sincronizar. Se conserva la copia local.';console.error('Agenda CNP sync:',e)}finally{cloudBusy=false;renderCloudStatus();if(syncAfterBusy){syncAfterBusy=false;scheduleSync()}}}
function renderCloudStatus(){const el=document.getElementById('cloud-status');if(!el)return;const online=navigator.onLine;el.innerHTML=`<span class="cloud-dot ${syncState==='ok'&&online?'ok':''}"></span><span>${esc(!online?'Sin conexión · se guardará en este dispositivo':syncMessage)}</span>`}
async function authAction(mode){if(!cloudClient){alert('Primero configura la URL y la clave pública de Supabase en el archivo index.html.');return}const email=$('#auth-email')?.value.trim(),password=$('#auth-password')?.value;if(!email||!password){alert('Introduce tu correo y una contraseña.');return}const btn=$('#auth-action');if(btn)btn.disabled=true;try{const result=mode==='signup'?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(mode==='signup'&&!result.data.session){alert('Cuenta creada. Revisa tu correo para confirmar la dirección y después inicia sesión.');return}await onAuthenticated(result.data.session?.user)}catch(e){alert('No se pudo completar el acceso: '+(e.message||e))}finally{if(btn)btn.disabled=false}}
async function onAuthenticated(user){if(!user)return;cloudUser=user;try{const {data,error}=await cloudClient.from('agenda_data').select('payload,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;const dirty=localStorage.getItem(DIRTY)==='1';if(data?.payload){if(dirty){if(confirm('Hay cambios locales y ya existe una copia en la nube. ¿Quieres subir los datos de ESTE dispositivo y sustituir la copia en la nube? Pulsa Cancelar para descargar la copia de la nube.'))await syncCloud();else{S=Object.assign(S,data.payload);localStorage.setItem(KEY,JSON.stringify(S));localStorage.removeItem(DIRTY);syncState='ok';syncMessage='Datos descargados de la nube'}}else{S=Object.assign(S,data.payload);localStorage.setItem(KEY,JSON.stringify(S));syncState='ok';syncMessage='Datos descargados de la nube'}}else{localStorage.setItem(DIRTY,'1');await syncCloud()}}catch(e){syncState='error';syncMessage='Error al cargar la nube; tus datos locales siguen disponibles';console.error(e)}render()}
async function logoutCloud(){if(!cloudClient)return;await cloudClient.auth.signOut();cloudUser=null;syncState='offline';syncMessage='Sesión cerrada';render()}
function cloudPanel(){const configured=!!cloudClient;return `<div class="card cloudbar"><div class="cloudstatus" id="cloud-status"><span class="cloud-dot"></span><span>${esc(!configured?'Pendiente de configurar Supabase':cloudUser?'Conectado · '+cloudUser.email: 'Inicia sesión para activar la sincronización')}</span></div>${!configured?`<p class="smallnote">Para activar la nube, pega la URL del proyecto y la clave anon/publicable en las dos constantes SUPABASE_URL y SUPABASE_ANON_KEY del archivo index.html. Después crea la tabla con el SQL incluido en la entrega.</p>`:cloudUser?`<div class="row" style="margin-top:10px"><button class="sm" onclick="syncCloud()">Sincronizar ahora</button><button class="sm ghost" onclick="logoutCloud()">Cerrar sesión</button></div>`:`<input id="auth-email" type="email" autocomplete="username" placeholder="Tu correo electrónico"><input id="auth-password" type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 8 caracteres)"><div class="authgrid"><button id="auth-action" onclick="authAction('login')">Iniciar sesión</button><button class="ghost" onclick="authAction('signup')">Crear mi cuenta</button></div><p class="smallnote">La cuenta es privada. No compartas tus credenciales. Si activas confirmación por correo en Supabase, confirma primero tu dirección.</p>`}</div>`}
window.addEventListener('online',()=>{if(cloudUser)scheduleSync();else{syncState='pending';syncMessage='Conexión recuperada'}});window.addEventListener('offline',()=>{syncState='offline';syncMessage='Sin conexión';renderCloudStatus()});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('sv-SE');
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function vincularBaremoFuerza(){
  let cambio=false;

  S.pruebas.forEach(p=>{
    const nombre=(p.n||'')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .trim()
      .toLowerCase();

    if(!p.bk && ['dominadas','suspension en barra'].includes(nombre)){
      p.bk='fu';
      cambio=true;
    }
  });

  return cambio;
}

if(vincularBaremoFuerza()) save();
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});

function cycle(id){const t=S.temas.find(x=>x.id===id);t.e=(t.e+1)%3;
 if(t.e===2){t.step=0;t.next=addDays(today(),IV[0])}else{t.next=null;t.step=0}save();render()}
function rev(id){const t=S.temas.find(x=>x.id===id);t.step++;t.next=t.step<IV.length?addDays(today(),IV[t.step]):null;save();render()}
function addH(m){S.horas[today()]=(S.horas[today()]||0)+m;save();render()}
function addTemas(){const b=$('#nb').value;if(!b){alert('Carga primero el temario oficial');return}const ls=$('#nt').value.split('\n').map(x=>x.trim()).filter(Boolean);
 ls.forEach(n=>S.temas.push({id:uid(),b,n,e:0,step:0,next:null}));save();render()}
function delTema(id){if(confirm('¿Borrar este tema?')){S.temas=S.temas.filter(x=>x.id!==id);save();render()}}
function addSim(){const n=parseFloat($('#sn').value.replace(',','.'));if(isNaN(n)||n<0||n>10){alert('La nota debe estar entre 0 y 10');return}
 S.sims.push({id:uid(),d:$('#sd').value||today(),n,t:$('#st').value.trim()});S.sims.sort((a,b)=>a.d.localeCompare(b.d));save();render()}
function delSim(id){S.sims=S.sims.filter(x=>x.id!==id);save();render()}
function setFecha(){S.fecha=$('#fx').value;save();render()}

function viewHoy(){
 const t=today(),dias=S.fecha?diff(t,S.fecha):null;
 const due=S.temas.filter(x=>x.next&&x.next<=t).sort((a,b)=>a.next.localeCompare(b.next));
 const mine=S.temas.filter(x=>x.id.startsWith(S.escala+'-')||!/^(ba|ej)-/.test(x.id)),done=mine.filter(x=>x.e===2).length,tot=mine.length;
 let wk='';const days=[];for(let i=6;i>=0;i--)days.push(addDays(t,-i));
 const mx=Math.max(60,...days.map(d=>S.horas[d]||0));
 days.forEach(d=>{const m=S.horas[d]||0;wk+=`<div><i style="height:${m/mx*60}px"></i>${new Date(d+'T12:00').toLocaleDateString('es-ES',{weekday:'narrow'})}</div>`});
 const tw=days.reduce((a,d)=>a+(S.horas[d]||0),0);
 return `<h1>Hoy</h1>
 <div class="card">${dias===null?'<span class="mut">Fija la fecha del examen en Ajustes para ver la cuenta atrás.</span>':
 `<div class="count"><b>${Math.max(dias,0)}</b><span>${dias<0?'La fecha ya ha pasado':dias===1?'día para el examen':'días para el examen'}</span></div><div class="mut">${fmt(S.fecha)}</div>`}</div>
 <div class="card"><div class="row"><div><b>${((S.horas[t]||0)/60).toFixed(1)} h</b> hoy<div class="mut">${(tw/60).toFixed(1)} h esta semana</div></div>
 <button class="sm" onclick="addH(30)">+30 min</button><button class="sm" onclick="addH(60)">+1 h</button><button class="sm ghost" onclick="addH(-30)">−30</button></div>
 <div class="week" style="margin-top:12px">${wk}</div></div>
 ${planHoy(t)}${entHoy(t)}<h2>Repasos pendientes (${due.length})</h2>
 <div class="card">${due.length?due.map(x=>`<div class="item"><span class="t">${esc(x.n)}<div class="mut ${x.next<t?'due':''}">${x.next<t?'Retrasado desde el ':'Para hoy · '}${fmt(x.next)}</div></div><button class="sm" onclick="rev('${x.id}')">Repasado</button></div>`).join(''):'<span class="mut">Nada pendiente. Los repasos aparecen al marcar un tema como estudiado.</span>'}</div>
 <h2>Progreso</h2><div class="card"><div class="mut">${done} de ${tot} temas estudiados</div><div class="bar"><i style="width:${tot?done/tot*100:0}%"></i></div></div>`;
}

ba:[['Ciencias jurídicas',['El Derecho, las normas jurídicas y la persona','La Constitución (I): estructura, valores y derechos fundamentales','La Constitución (II): Corona, Cortes, Gobierno, Poder Judicial, TC y reforma','La Unión Europea y la cooperación policial internacional','La Administración General del Estado y el Gobierno','Los funcionarios públicos','El Ministerio del Interior y la Secretaría de Estado de Seguridad','La Dirección General de la Policía y la Policía Nacional','Ley Orgánica de Fuerzas y Cuerpos de Seguridad','Extranjería: entrada, circulación y residencia','Extranjería: infracciones y sanciones','Protección internacional','Seguridad privada','Ley de protección de la seguridad ciudadana','Infraestructuras críticas y ciberseguridad','Derecho Penal: parte general','Derecho Penal: homicidio, lesiones, libertad y delitos sexuales','Delitos contra el patrimonio y el orden socioeconómico','Delitos contra el orden público','Delitos informáticos y prueba digital','Derecho Procesal Penal: detención, habeas corpus y Policía Judicial','Estatuto de la víctima del delito','Políticas de igualdad y no discriminación','Introducción a la prevención de riesgos laborales','Marco normativo de prevención de riesgos laborales','Protección de datos personales']],
['Ciencias sociales',['Derechos Humanos','Globalización y antiglobalización','Actitudes y valores sociales','Principios éticos, contravalores y delitos de odio','Inmigración y movimientos migratorios','Geografía humana, demografía y medio ambiente','La seguridad y las teorías de la delincuencia','Drogodependencias','El desarrollo sostenible','Gramática de la lengua española','Ortografía de la lengua española']],
['Materias técnico-científicas',['Sistemas operativos','Redes informáticas','Inteligencia y fuentes abiertas (OSINT)','Ciberdelincuencia y agentes de amenaza','Armas de fuego y balística forense','El vehículo prioritario','Seguridad activa y pasiva en vehículos prioritarios','Prevención de riesgos laborales en seguridad vial']]],

rorismo y traición','La potestad jurisdiccional y los órganos penales','El proceso penal: sumario, procedimiento abreviado y habeas corpus','Las partes en el proceso penal','Medidas cautelares personales y detención','La prueba en el proceso penal','Entrada y registro; investigación tecnológica','Estatuto de la víctima del delito','Políticas de igualdad, violencia de género y discapacidad','Prevención de riesgos laborales']],

['Ciencias técnico-científicas',['Metodología científica','Metodología en ciencias sociales','Estadística','Contabilidad y fiscalidad de la empresa','Redes informáticas','Sistemas operativos','Ciberdelincuencia y agentes de amenaza','Inteligencia, Big Data y Cloud Computing','Seguridad de la información','Documentación del vehículo y del conductor','Procedimiento sancionador de tráfico y accidentes','El vehículo prioritario','Armas de fuego y balística forense']]]};
function cargarTemario(sc){let num=0;TEM[sc].forEach(([nm,ts],i)=>{const bid=sc+(i+1);if(!S.bloques.some(b=>b.id===bid))S.bloques.push({id:bid,n:nm,sc});
 ts.forEach(t=>{num++;const id=sc+'-'+num;if(!S.temas.some(x=>x.id===id))S.temas.push({id,b:bid,n:num+'. '+t,e:0,step:0,next:null})})});save();render()}
function setEscala(x){S.escala=x;save();render()}
function escalaBar(){const n=S.temas.filter(x=>x.id.startsWith(S.escala+'-')).length,tot=S.escala==='ba'?45:81;
 return `<div class="chips"><button class="${S.escala==='ba'?'on':''}" onclick="setEscala('ba')">Escala Básica</button><button class="${S.escala==='ej'?'on':''}" onclick="setEscala('ej')">Escala Ejecutiva</button></div>
 <div class="card">${n>=tot?'Temario oficial cargado ('+tot+' temas).':`<button onclick="cargarTemario('${S.escala}')">${n?'Restaurar':'Cargar'} temario oficial (${tot} temas)</button>`}<div class="mut" style="margin-top:8px">Títulos abreviados del programa de la convocatoria de 2026. El texto completo de cada tema está en el anexo de las bases oficiales.</div></div>`}

 const fold=l=>{let o='';while(l.length>74){o+=l.slice(0,74)+'\r\n ';l=l.slice(74)}return o+l};
 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda CNP//ES','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n').split('\r\n').map(fold).join('\r\n')+'\r\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download='agenda-cnp.ics';document.body.appendChild(a);a.click();a.remove()}
function viewAjustes(){
 return `<h1>Ajustes</h1><div class="card"><label>Fecha del examen<input id="fx" type="date" value="${S.fecha||''}" onchange="setFecha()"></label></div>
 <h2>Recordatorios en el calendario</h2><div class="card"><p class="mut" style="margin-top:0">Genera un archivo para el Calendario del iPhone con un aviso diario de estudio, tus repasos, los entrenos pendientes y el examen.</p><div class="row"><label>Estudio<input id="rh" type="time" value="${S.rh||'18:00'}" onchange="S.rh=this.value;save()"></label><label>Entreno<input id="rt" type="time" value="${S.rt||'19:00'}" onchange="S.rt=this.value;save()"></label></div><button onclick="makeIcs()">Descargar recordatorios</button><div class="mut" style="margin-top:8px">Al abrir el archivo, elige un calendario nuevo llamado «Agenda CNP»: así podrás borrarlo entero y volver a importar cuando cambien tus repasos.</div></div>
 <h2>Copia de seguridad</h2><div class="card"><p class="mut" style="margin-top:0">Los datos viven en este dispositivo. Exporta una copia de vez en cuando (por ejemplo cada domingo) y guárdala en iCloud o Drive. La app instalada en la pantalla de inicio guarda sus datos aparte de los de Safari.</p>
 <div class="row"><button onclick="exp('json')">Exportar JSON</button><button class="ghost" onclick="exp('csv')">Exportar Excel (CSV)</button></div>
 <p style="margin-bottom:4px">Importar copia (JSON)</p><input type="file" accept=".json,application/json" onchange="imp(this.files[0])"></div>
 <div class="card"><button class="ghost" onclick="if(confirm('Se borrarán todos los datos de esta app.')){S={fecha:'',bloques:S.bloques,temas:[],sims:[],horas:{},fis:[],entr:[],pruebas:S.pruebas,sexo:S.sexo,escala:S.escala};save();render()}">Borrar todos los datos</button></div>`;
}
function exp(kind){let txt,type,name='agenda-cnp-'+today();
 if(kind==='json'){txt=JSON.stringify(S,null,1);type='application/json';name+='.json'}
 else{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const bn=id=>(S.bloques.find(b=>b.id===id)||{}).n;
  const L=['Temas','Bloque;Tema;Estado;Próximo repaso',...S.temas.map(t=>[bn(t.b),t.n,['Sin empezar','En estudio','Estudiado'][t.e],t.next||''].map(q).join(';')),'','Simulacros','Fecha;Nota;Detalle',...S.sims.map(s=>[s.d,s.n,s.t].map(q).join(';')),'','Pruebas físicas','Prueba;Fecha;Tipo;Marca (s o rep);Nota;Comentario',...S.fis.map(r=>{const p=S.pruebas.find(x=>x.id===r.p)||{};return [p.n,r.d,r.k==='s'?'Simulacro':'Entrenamiento',r.v,(notaOf(p,r.v)??(r.n==null?'':r.n)),r.c].map(q).join(';')}),'','Entrenamientos del entrenador','Fecha;Título;Tipo;Contenido;Hecho;Esfuerzo;Minutos;Resultado',...S.entr.map(e=>[e.d,e.t,e.k,e.c,e.done?'Sí':'No',e.rpe==null?'':e.rpe,e.min==null?'':e.min,e.res].map(q).join(';')),'','Horas','Fecha;Minutos',...Object.entries(S.horas).sort().map(e=>e.join(';'))];
  txt='\ufeff'+L.join('\n');type='text/csv';name+='.csv'}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.temas||!d.sims)throw 0;S=Object.assign(S,d);save();render();alert('Copia importada')}catch(e){alert('El archivo no es una copia válida de la agenda')}};r.readAsText(f)}

function render(){
 $('#app').innerHTML=cloudPanel()+[viewHoy,viewTemario,viewSims,viewFis,viewEntr,viewAjustes][tab]();
 renderCloudStatus();
 $('#nav').innerHTML=TABS.map((n,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};render();scrollTo(0,0)">${n}</button>`).join('');
}
render();
if(cloudClient){cloudClient.auth.getSession().then(({data})=>{if(data.session)onAuthenticated(data.session.user)});cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;render()}else if(event==='SIGNED_IN'&&session?.user&&!cloudUser)onAuthenticated(session.user)})}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
